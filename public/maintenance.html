<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>野有蔓草 - 网页维护中</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F5F0E6;
      color: #1A1A1A;
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      background: #FAF7F0;
      border: 1px solid #C9A96E;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(178, 34, 34, 0.1);
      position: relative;
    }
    .badge {
      display: inline-block;
      color: #B22222;
      border: 1px solid #B22222;
      padding: 4px 16px;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      border-radius: 2px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #1A1A1A;
      margin-bottom: 16px;
    }
    p {
      color: #666;
      font-size: 15px;
      line-height: 1.8;
      margin-top: 12px;
    }
    .brand {
      margin-top: 32px;
      font-size: 13px;
      color: #C9A96E;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">野有蔓草 · 匠心传承</div>
    <h1>网页维护中，敬请期待</h1>
    <p>传承东方吉服美学，系统正在升级维护中。<br>如需加急定制，请联系非遗礼服工坊客服。</p>
    <div class="brand">野有蔓草 · 传统婚嫁礼服定制平台</div>
  </div>
</body>
</html>

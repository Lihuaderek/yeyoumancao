<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <!-- 玄黑绸缎与高光微渐变 -->
    <linearGradient id="arJacket2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12141A" />
      <stop offset="25%" stop-color="#222634" />
      <stop offset="50%" stop-color="#2D3346" />
      <stop offset="75%" stop-color="#222634" />
      <stop offset="100%" stop-color="#12141A" />
    </linearGradient>
    <linearGradient id="arGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#A67C1A" />
    </linearGradient>
    <linearGradient id="arRedSkirt2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C1313" />
      <stop offset="100%" stop-color="#540808" />
    </linearGradient>
    <filter id="garmentShadow2" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#garmentShadow2)">
    <!-- 下身朱红马面长裙 (Men's Traditional Lower Skirt) -->
    <path d="M 180 340 L 130 680 L 370 680 L 320 340 Z" fill="url(#arRedSkirt2)" />
    <!-- 裙身金线中脊与褶裥 -->
    <line x1="250" y1="340" x2="250" y2="645" stroke="url(#arGold2)" stroke-width="3" />
    <line x1="210" y1="360" x2="175" y2="645" stroke="url(#arGold2)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.85" />
    <line x1="290" y1="360" x2="325" y2="645" stroke="url(#arGold2)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.85" />

    <!-- 裙底江崖海水金澜纹 -->
    <path d="M 130 645 L 370 645 L 370 680 L 130 680 Z" fill="url(#arGold2)" />
    <path d="M 130 655 C 160 635 180 665 210 645 C 240 665 270 635 300 660 C 330 635 370 655 370 655" stroke="#540808" stroke-width="2.5" fill="none" />

    <!-- 上身玄黑对襟马褂 (Upper Jacket) -->
    <path d="
      M 215 50
      C 185 58, 145 68, 120 80
      L 50 200
      L 95 245
      L 170 190
      L 175 350
      L 325 350
      L 330 190
      L 405 245
      L 450 200
      C 425 68, 385 58, 355 50
      C 340 40, 310 35, 250 35
      C 190 35, 160 40, 215 50
      Z
    " fill="url(#arJacket2)" />

    <!-- 华贵金袖口 (Golden Cuffs) -->
    <polygon points="50,200 95,245 108,232 63,187" fill="url(#arGold2)" />
    <polygon points="450,200 405,245 392,232 437,187" fill="url(#arGold2)" />

    <!-- 正统中式立领 (Collar) -->
    <path d="
      M 210 52
      C 210 32, 290 32, 290 52
      L 298 64
      C 298 42, 202 42, 202 64
      Z
    " fill="url(#arGold2)" stroke="#12141A" stroke-width="0.8" />

    <!-- 正中对襟中缝金边 (Center Front Placket) -->
    <rect x="245" y="55" width="10" height="295" fill="url(#arGold2)" />
    <line x1="250" y1="55" x2="250" y2="350" stroke="#12141A" stroke-width="1.5" />

    <!-- 对襟纯金盘扣 (Gilded Frog Buttons) -->
    <g fill="#FFF5CC" stroke="url(#arGold2)" stroke-width="1.2">
      <circle cx="250" cy="75" r="3.5" />
      <circle cx="250" cy="120" r="3.5" />
      <circle cx="250" cy="165" r="3.5" />
      <circle cx="250" cy="210" r="3.5" />
      <circle cx="250" cy="255" r="3.5" />
      <circle cx="250" cy="300" r="3.5" />
      <circle cx="250" cy="340" r="3.5" />
    </g>

    <!-- 潮绣左右双龙浮雕盘金 (Chaozhou 3D Dragons) -->
    <!-- 左胸金龙 -->
    <path d="M 195 120 Q 215 95 230 125 Q 238 160 210 175 Q 190 155 200 140" fill="none" stroke="url(#arGold2)" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="220" cy="105" r="4.5" fill="#FFF" />
    <path d="M 228 150 L 236 145 M 205 165 L 208 178" stroke="url(#arGold2)" stroke-width="2.5" />

    <!-- 右胸金龙 -->
    <path d="M 305 120 Q 285 95 270 125 Q 262 160 290 175 Q 310 155 300 140" fill="none" stroke="url(#arGold2)" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="280" cy="105" r="4.5" fill="#FFF" />
    <path d="M 272 150 L 264 145 M 295 165 L 292 178" stroke="url(#arGold2)" stroke-width="2.5" />

    <!-- 肩头祥云五福金蝠 (Shoulder Auspicious Clouds) -->
    <path d="M 150 110 Q 165 98 175 115" stroke="url(#arGold2)" stroke-width="2" fill="none" />
    <path d="M 350 110 Q 335 98 325 115" stroke="url(#arGold2)" stroke-width="2" fill="none" />

    <!-- 马褂下摆金镶边 -->
    <rect x="175" y="343" width="150" height="7" fill="url(#arGold2)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E202A" />
      <stop offset="100%" stop-color="#0E0F14" />
    </linearGradient>
    <linearGradient id="jacketBlack2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15171E" />
      <stop offset="50%" stop-color="#242834" />
      <stop offset="100%" stop-color="#121319" />
    </linearGradient>
    <linearGradient id="redSkirt2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#801212" />
      <stop offset="50%" stop-color="#A81B1B" />
      <stop offset="100%" stop-color="#730E0E" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="silver2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D8DDE6" />
      <stop offset="100%" stop-color="#9BA3AF" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bgGrad2)" />
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3" rx="8" />
  <circle cx="300" cy="380" r="240" fill="#D4AF37" fill-opacity="0.04" />

  <!-- Corner Ornaments -->
  <path d="M 35 55 L 55 55 L 55 35" fill="none" stroke="#D4AF37" stroke-width="2" />
  <path d="M 565 55 L 545 55 L 545 35" fill="none" stroke="#D4AF37" stroke-width="2" />
  <path d="M 35 745 L 55 745 L 55 765" fill="none" stroke="#D4AF37" stroke-width="2" />
  <path d="M 565 745 L 545 745 L 545 765" fill="none" stroke="#D4AF37" stroke-width="2" />

  <!-- Garment: Men's Longfeng Gua -->
  <g id="mens-longfeng" transform="translate(0, 40)">
    <!-- Lower Robe/Skirt (传统朱红长马面裙) -->
    <path d="M 210 380 L 160 670 L 440 670 L 390 380 Z" fill="url(#redSkirt2)" />
    <!-- Bottom Waves & Clouds (江崖海水纹) -->
    <path d="M 160 635 L 440 635 L 440 670 L 160 670 Z" fill="url(#gold2)" />
    <path d="M 160 645 C 190 620 210 655 240 635 C 270 655 300 625 330 650 C 360 625 390 655 440 635" fill="none" stroke="#6B0B0B" stroke-width="2.5" />
    <line x1="300" y1="380" x2="300" y2="635" stroke="url(#gold2)" stroke-width="3" />

    <!-- Upper Jacket (玄黑潮绣对襟褂) -->
    <path d="M 215 140 L 95 275 L 145 325 L 210 260 L 210 405 L 390 405 L 390 260 L 455 325 L 505 275 L 385 140 Z" fill="url(#jacketBlack2)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))" />

    <!-- Gold Cuffs -->
    <polygon points="95,275 145,325 160,310 110,260" fill="url(#gold2)" />
    <polygon points="505,275 455,325 440,310 490,260" fill="url(#gold2)" />

    <!-- Center Placket (正中对襟) -->
    <rect x="294" y="145" width="12" height="260" fill="url(#gold2)" />
    <line x1="300" y1="145" x2="300" y2="405" stroke="#1A1A1A" stroke-width="1.5" />

    <!-- Mandarin Collar -->
    <path d="M 260 145 C 260 120 340 120 340 145 L 350 160 C 350 140 250 140 250 160 Z" fill="url(#gold2)" />

    <!-- Frog Buttons -->
    <g fill="#D4AF37" stroke="#FFF0B8" stroke-width="1">
      <circle cx="300" cy="170" r="4" />
      <circle cx="300" cy="210" r="4" />
      <circle cx="300" cy="250" r="4" />
      <circle cx="300" cy="290" r="4" />
      <circle cx="300" cy="330" r="4" />
      <circle cx="300" cy="370" r="4" />
    </g>

    <!-- Chaozhou Heavy Gold Embroidery: Dragon & Clouds (左龙右云) -->
    <!-- Left Chest Golden Dragon -->
    <path d="M 230 200 Q 255 175 275 205 Q 285 240 255 255 Q 235 235 245 220" fill="none" stroke="url(#gold2)" stroke-width="4" stroke-linecap="round" />
    <circle cx="260" cy="185" r="5" fill="url(#silver2)" />
    <!-- Dragon Claws & Scales -->
    <path d="M 268 230 L 278 225 M 245 245 L 248 258" stroke="url(#gold2)" stroke-width="2.5" />

    <!-- Right Chest Golden Dragon -->
    <path d="M 370 200 Q 345 175 325 205 Q 315 240 345 255 Q 365 235 355 220" fill="none" stroke="url(#gold2)" stroke-width="4" stroke-linecap="round" />
    <circle cx="340" cy="185" r="5" fill="url(#silver2)" />
    <path d="M 332 230 L 322 225 M 355 245 L 352 258" stroke="url(#gold2)" stroke-width="2.5" />

    <!-- Shoulders Golden Clouds -->
    <path d="M 180 180 Q 200 170 210 190 Q 220 180 230 195" fill="none" stroke="url(#gold2)" stroke-width="2" />
    <path d="M 420 180 Q 400 170 390 190 Q 380 180 370 195" fill="none" stroke="url(#gold2)" stroke-width="2" />

    <!-- Bottom Hem Gold Border -->
    <rect x="210" y="398" width="180" height="7" fill="url(#gold2)" />
  </g>

  <!-- Title Badge Inset -->
  <g transform="translate(300, 720)">
    <rect x="-140" y="-20" width="280" height="40" rx="4" fill="#0E0F14" stroke="#D4AF37" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Noto Serif SC', serif" font-size="16" fill="#FFF0B8" font-weight="600" text-anchor="middle" letter-spacing="3">龙章凤姿 · 男士潮绣龙凤褂</text>
  </g>
</svg>

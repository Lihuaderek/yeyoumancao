<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <!-- 华堂朱红与暗部渐变 -->
    <linearGradient id="arRed1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#730E0E" />
      <stop offset="20%" stop-color="#9C1717" />
      <stop offset="50%" stop-color="#BA1F1F" />
      <stop offset="80%" stop-color="#9C1717" />
      <stop offset="100%" stop-color="#730E0E" />
    </linearGradient>
    <linearGradient id="arGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BD" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B88A22" />
      <stop offset="100%" stop-color="#73520E" />
    </linearGradient>
    <linearGradient id="arDarkRed1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#801010" />
      <stop offset="100%" stop-color="#4A0606" />
    </linearGradient>
    <filter id="garmentShadow1" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#garmentShadow1)">
    <!-- 下身马面裙下摆 (Pleated Lower Robe) -->
    <path d="M 180 340 L 130 680 L 370 680 L 320 340 Z" fill="url(#arDarkRed1)" />
    <!-- 马面裙褶裥金线 -->
    <line x1="210" y1="360" x2="175" y2="670" stroke="url(#arGold1)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.8" />
    <line x1="250" y1="340" x2="250" y2="670" stroke="url(#arGold1)" stroke-width="3" />
    <line x1="290" y1="360" x2="325" y2="670" stroke="url(#arGold1)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.8" />

    <!-- 裙摆底边海水江崖波浪绣 (Hem Wave Border) -->
    <path d="M 130 645 L 370 645 L 370 680 L 130 680 Z" fill="url(#arGold1)" />
    <path d="M 130 655 Q 160 635 190 655 Q 220 635 250 655 Q 280 635 310 655 Q 340 635 370 655" stroke="#5E0B0B" stroke-width="2.5" fill="none" />

    <!-- 上身长袍主廓形 (Torso & Sleeves) -->
    <!-- 左肩端点 (120, 80)，领口 (250, 50)，右肩端点 (380, 80) -->
    <path d="
      M 215 50
      C 185 58, 145 68, 120 80
      L 50 200
      L 95 245
      L 170 190
      L 175 350
      L 325 350
      L 330 190
      L 405 245
      L 450 200
      C 425 68, 385 58, 355 50
      C 340 40, 310 35, 250 35
      C 190 35, 160 40, 215 50
      Z
    " fill="url(#arRed1)" />

    <!-- 袖口金边镶饰 (Cuff Trims) -->
    <polygon points="50,200 95,245 108,232 63,187" fill="url(#arGold1)" />
    <polygon points="450,200 405,245 392,232 437,187" fill="url(#arGold1)" />

    <!-- 正统中式立领 (Mandarin Collar - 镂空中空贴合颈部) -->
    <path d="
      M 210 52
      C 210 32, 290 32, 290 52
      L 298 64
      C 298 42, 202 42, 202 64
      Z
    " fill="url(#arGold1)" stroke="#801010" stroke-width="0.8" />

    <!-- 右衽大襟弧线 (Traditional Diagonal Front Placket) -->
    <path d="M 250 55 Q 285 105 315 145 L 315 350" fill="none" stroke="url(#arGold1)" stroke-width="4.5" />

    <!-- 手工编织金丝盘扣 (Frog Buttons) -->
    <g fill="#FFF0BD" stroke="url(#arGold1)" stroke-width="1.2">
      <!-- 领口扣 -->
      <circle cx="250" cy="62" r="3.5" />
      <!-- 胸襟扣组 -->
      <circle cx="272" cy="90" r="3.5" />
      <circle cx="295" cy="120" r="3.5" />
      <circle cx="315" cy="155" r="3.5" />
      <circle cx="315" cy="205" r="3.5" />
      <circle cx="315" cy="255" r="3.5" />
      <circle cx="315" cy="305" r="3.5" />
    </g>

    <!-- 胸前吉祥团龙盘金绣 (Dragon Medallion) -->
    <g transform="translate(205, 140)">
      <circle cx="35" cy="35" r="36" fill="#6B0C0C" stroke="url(#arGold1)" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="35" cy="35" r="32" fill="none" stroke="url(#arGold1)" stroke-width="1.2" />
      <!-- 龙首与腾龙游纹 -->
      <path d="M 25 25 Q 45 10 50 30 Q 52 50 38 48 Q 20 48 30 35 Q 42 22 25 25" fill="none" stroke="url(#arGold1)" stroke-width="2.8" stroke-linecap="round" />
      <!-- 火焰龙珠 -->
      <circle cx="44" cy="22" r="4.5" fill="#FFEAA7" />
    </g>

    <!-- 腰部祥云金带 (Embroidered Waistband) -->
    <rect x="175" y="335" width="150" height="15" fill="url(#arGold1)" rx="2" />
    <!-- 翡翠压襟佩玉 -->
    <circle cx="250" cy="342" r="7" fill="#48B890" stroke="#FFF" stroke-width="1" />
    <path d="M 248 349 L 248 385 M 250 349 L 250 390 M 252 349 L 252 385" stroke="url(#arGold1)" stroke-width="1.5" />
  </g>
</svg>

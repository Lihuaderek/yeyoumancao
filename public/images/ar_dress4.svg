<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <!-- 褂皇至尊纯金线全密地渐变 -->
    <linearGradient id="arGuaGold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="20%" stop-color="#ECD06C" />
      <stop offset="50%" stop-color="#CCA033" />
      <stop offset="80%" stop-color="#F5DE82" />
      <stop offset="100%" stop-color="#A67B18" />
    </linearGradient>
    <linearGradient id="arSilver4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E1E5EC" />
      <stop offset="100%" stop-color="#B2BAC6" />
    </linearGradient>
    <linearGradient id="arGoldDark4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C058" />
      <stop offset="100%" stop-color="#916B12" />
    </linearGradient>
    <filter id="garmentShadow4" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#garmentShadow4)">
    <!-- 下身金银密地裙 (Gua Huang Lower Skirt) -->
    <path d="M 185 330 L 125 670 L 375 670 L 315 330 Z" fill="url(#arGoldDark4)" stroke="#A67B18" stroke-width="1.2" />

    <!-- 裙门金银龙凤戏珠中线 -->
    <line x1="250" y1="330" x2="250" y2="640" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 3" />
    <!-- 纯银波浪水脚底边 -->
    <path d="M 125 640 L 375 640 L 375 670 L 125 670 Z" fill="url(#arSilver4)" opacity="0.95" />
    <path d="M 125 650 Q 155 630 185 650 Q 215 630 250 650 Q 285 630 315 650 Q 345 630 375 650" stroke="#8C660D" stroke-width="2" fill="none" />

    <!-- 裙身浮雕银龙与金凤 -->
    <circle cx="250" cy="460" r="12" fill="url(#arSilver4)" stroke="#CCA033" stroke-width="2" />
    <path d="M 215 480 Q 200 440 235 430 Q 248 445 240 470" fill="none" stroke="#FFFFFF" stroke-width="2.8" />
    <path d="M 285 480 Q 300 440 265 430 Q 252 445 260 470" fill="none" stroke="#FFFFFF" stroke-width="2.8" />

    <!-- 上身褂皇密地对襟上衣 (Upper Jacket) -->
    <path d="
      M 215 50
      C 185 58, 145 68, 120 80
      L 55 190
      L 100 235
      L 165 180
      L 180 340
      L 320 340
      L 335 180
      L 400 235
      L 445 190
      C 420 68, 385 58, 355 50
      C 340 40, 310 35, 250 35
      C 190 35, 160 40, 215 50
      Z
    " fill="url(#arGuaGold4)" />

    <!-- 纯银挽袖袖口 (Silver Cuffs) -->
    <polygon points="55,190 100,235 112,223 67,178" fill="url(#arSilver4)" />
    <polygon points="445,190 400,235 388,223 433,178" fill="url(#arSilver4)" />

    <!-- 正统中式立领 (Collar) -->
    <path d="
      M 210 52
      C 210 32, 290 32, 290 52
      L 298 64
      C 298 42, 202 42, 202 64
      Z
    " fill="url(#arSilver4)" stroke="#A67B18" stroke-width="1.2" />

    <!-- 正中银线对襟门襟 (Silver Front Placket) -->
    <rect x="244" y="55" width="12" height="285" fill="url(#arSilver4)" stroke="#A67B18" stroke-width="1" />
    <line x1="250" y1="55" x2="250" y2="340" stroke="#CCA033" stroke-width="1.5" />

    <!-- 手工编织纯银线盘扣 (Silver Frog Buttons) -->
    <g fill="#FFFFFF" stroke="#8C660D" stroke-width="1.5">
      <circle cx="250" cy="72" r="3.8" />
      <circle cx="250" cy="115" r="3.8" />
      <circle cx="250" cy="158" r="3.8" />
      <circle cx="250" cy="202" r="3.8" />
      <circle cx="250" cy="246" r="3.8" />
      <circle cx="250" cy="290" r="3.8" />
      <circle cx="250" cy="332" r="3.8" />
    </g>

    <!-- 浮雕立体金银龙凤 (Relief Silver Dragon & Phoenix) -->
    <!-- 左身纯银龙 (Left Silver Dragon) -->
    <path d="M 205 130 Q 185 155 210 180 Q 230 195 215 220" fill="none" stroke="url(#arSilver4)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="202" cy="128" r="5" fill="#FFF" />
    <circle cx="202" cy="128" r="2.5" fill="#B22222" />

    <!-- 右身纯银凤 (Right Silver Phoenix) -->
    <path d="M 295 130 Q 315 155 290 180 Q 270 195 285 220" fill="none" stroke="url(#arSilver4)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="298" cy="128" r="5" fill="#FFF" />
    <circle cx="298" cy="128" r="2.5" fill="#B22222" />

    <!-- 肩头五福银蝠 (Five Bats of Fortune) -->
    <path d="M 155 120 Q 165 110 175 120 Q 165 130 155 120 Z" fill="#FFF" stroke="#A67B18" stroke-width="1" />
    <path d="M 345 120 Q 335 110 325 120 Q 335 130 345 120 Z" fill="#FFF" stroke="#A67B18" stroke-width="1" />

    <!-- 下摆纯银包边 -->
    <rect x="180" y="334" width="140" height="7" fill="url(#arSilver4)" />
  </g>
</svg>
